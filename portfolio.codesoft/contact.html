<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ganesh Gupta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portfolio.css">
</head>
<body>
    <!-- Meteor Shower Background -->
    <div class="meteor-container" id="meteor-container"></div>
    
    <!-- Stars Background -->
    <div class="stars" id="stars"></div>
    
    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Navigation -->
    <nav class="portfolio-nav">
        <a href="portfolio.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a href="projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Projects</a>
        <a href="contact.html" class="nav-link active"><i class="fas fa-envelope"></i> Contact</a>
    </nav>

    <!-- Main Container -->
    <div class="portfolio-container">
        <div class="page-header">
            <h1 class="page-title">Get In Touch</h1>
            <p class="page-subtitle">Let's connect and build something amazing together</p>
        </div>

        <!-- Contact Section -->
        <div class="contact-section">
            <div class="contact-info">
                <a href="mailto:nihalnigam1@gmail.com" class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <h3>Email</h3>
                    <p>nihalnigam1@gmail.com</p>
                </a>
                <a href="https://www.linkedin.com/in/ganesh-gupta-05903b338" target="_blank" class="contact-card">
                    <div class="contact-icon">
                        <i class="fab fa-linkedin"></i>
                    </div>
                    <h3>LinkedIn</h3>
                    <p>linkedin.com/in/ganesh-gupta-05903b338</p>
                </a>
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fab fa-instagram"></i>
                    </div>
                    <h3>Instagram</h3>
                    <p>@ganeshgupta</p>
                </div>
                <a href="https://github.com/nihalnigam1-stack" target="_blank" class="contact-card">
                    <div class="contact-icon">
                        <i class="fab fa-github"></i>
                    </div>
                    <h3>GitHub</h3>
                    <p>github.com/nihalnigam1-stack</p>
                </a>
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <h3>Location</h3>
                    <p>Ayodhya, Uttar Pradesh, India</p>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="contact-form-container">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="Subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message <i class="fas fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </div>

    <script src="portfolio.js"></script>
</body>
</html>
